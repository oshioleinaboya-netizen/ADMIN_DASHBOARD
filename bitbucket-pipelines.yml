image: cypress/browsers:node18.12.0-chrome107

pipelines:
  branches:
    ci_integration:
      - step:
          name: Run Cypress E2E
          caches:
            - node
          script:
            # 1️⃣ Install dependencies
            - npm ci

            # 2️⃣ Debug deployed URL (uses Bitbucket secret directly)
            - echo "Base URL = $RANK_LINK"
            - curl -I "$RANK_LINK"

            # 3️⃣ Run Cypress
            - npx cypress run --browser chrome || export CYPRESS_FAILED=true

            # 4️⃣ Generate Allure report
            - apt-get update && apt-get install -y default-jre
            - npm install -g allure-commandline
            - allure generate allure-results --clean -o allure-report

            # 5️⃣ Send Telegram notifications
            - |
              if [ "$CYPRESS_FAILED" = "true" ]; then
                echo "❌ Tests failed — sending Telegram notifications..."
                shopt -s globstar nullglob
                for file in cypress/screenshots/**/*.png; do
                  curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendPhoto" \
                    -F chat_id="$TELEGRAM_CHAT_ID" \
                    -F photo=@"$file" \
                    -F caption="❌ Cypress Test Failed"
                done
                curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                  -d chat_id="$TELEGRAM_CHAT_ID" \
                  -d text="❌ *Cypress Tests Failed!*%0ABranch: $BITBUCKET_BRANCH%0ACommit: $BITBUCKET_COMMIT" \
                  -d parse_mode=Markdown
                exit 1
              else
                echo "✅ Tests passed — sending Telegram notification..."
                curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                  -d chat_id="$TELEGRAM_CHAT_ID" \
                  -d text="✅ *Cypress Tests Passed!* 🎉%0ABranch: $BITBUCKET_BRANCH%0ACommit: $BITBUCKET_COMMIT" \
                  -d parse_mode=Markdown
              fi
          artifacts:
            - cypress/videos/**
            - cypress/screenshots/**
            - allure-report/**
