image: cypress/browsers:node18.12.0-chrome107

pipelines:
  default:
    - step:
        name: Run Cypress E2E Tests
        caches:
          - node
        script:
          # 1️⃣ Install dependencies
          - npm ci

          # 2️⃣ Debug deployed URL
          - echo "Base URL = $CYPRESS_baseUrl"
          - curl -I "$CYPRESS_baseUrl"

          # 3️⃣ Run Cypress tests
          - npx cypress run --browser chrome || export CYPRESS_FAILED=true

          # 4️⃣ Generate Allure report
          - npm install -g allure-commandline
          - allure generate allure-results --clean -o allure-report || true

          # 5️⃣ Upload artifacts
          - pipe: atlassian/upload-artifact:1.1.0
            variables:
              ARTIFACT_PATH: 'cypress/videos/**'
          - pipe: atlassian/upload-artifact:1.1.0
            variables:
              ARTIFACT_PATH: 'cypress/screenshots/**'
          - pipe: atlassian/upload-artifact:1.1.0
            variables:
              ARTIFACT_PATH: 'allure-report/**'

          # 6️⃣ Send failure screenshots to Telegram
          - |
            if [ "$CYPRESS_FAILED" = "true" ]; then
              echo "Sending failure screenshots to Telegram..."
              shopt -s globstar nullglob
              for file in cypress/screenshots/**/*.png; do
                curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendPhoto" \
                  -F chat_id="$TELEGRAM_CHAT_ID" \
                  -F photo=@"$file" \
                  -F caption="❌ Cypress Test Failed (Screenshot attached)"
              done
            fi

          # 7️⃣ Send Telegram summary
          - |
            if [ "$CYPRESS_FAILED" = "true" ]; then
              curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                -d chat_id="$TELEGRAM_CHAT_ID" \
                -d text="❌ *Cypress Tests Failed!*%0ABranch: $BITBUCKET_BRANCH%0ACommit: $BITBUCKET_COMMIT" \
                -d parse_mode=Markdown
              exit 1
            else
              curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                -d chat_id="$TELEGRAM_CHAT_ID" \
                -d text="✅ *Cypress Tests Passed!* 🎉%0ABranch: $BITBUCKET_BRANCH%0ACommit: $BITBUCKET_COMMIT" \
                -d parse_mode=Markdown
            fi

        artifacts:
          - cypress/videos/**
          - cypress/screenshots/**
          - allure-report/**
