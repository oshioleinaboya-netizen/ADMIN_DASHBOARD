name: Run Cypress Tests

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Run Cypress tests with GitHub Action (headless + environment)
      - name: Run Cypress Tests with Allure
        uses: cypress-io/github-action@v5
        with:
          start: npm start               # start your app if needed
          wait-on: ${{ secrets.RANK_LINK }} # wait for base URL
          wait-on-timeout: 60           # 60s timeout
          browser: chrome               # run in Chrome
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RANK_LINK: ${{ secrets.RANK_LINK }}
          CYPRESS_baseUrl: ${{ secrets.RANK_LINK }}
          CYPRESS_defaultCommandTimeout: 10000
          CYPRESS_pageLoadTimeout: 60000
          CYPRESS_viewportWidth: 1280
          CYPRESS_viewportHeight: 720

      # 5️⃣ Upload Cypress screenshots/videos if tests fail
      - name: Upload Cypress Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/videos
            cypress/screenshots

      # 6️⃣ Generate Allure HTML report
      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      # 7️⃣ Upload Allure HTML report as artifact
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      # 8️⃣ Send failure screenshots to Telegram
      - name: Send Failure Screenshots to Telegram
        if: failure()
        run: |
          shopt -s globstar nullglob
          for file in cypress/screenshots/**/*.png; do
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendPhoto" \
              -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -F photo=@"$file" \
              -F caption="❌ Cypress Test Failed (Screenshot attached)"
          done

      # 9️⃣ Send Telegram summary message with Allure report link
      - name: Send Telegram Notification
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ *Cypress Tests Failed!*%0ARepo: $GITHUB_REPOSITORY%0AWorkflow: $GITHUB_WORKFLOW%0ARun: $GITHUB_RUN_NUMBER%0AView Allure Report: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            -d parse_mode=Markdown

      # 🔟 ✅ Send SUCCESS message
      - name: Send Telegram Success Notification
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ *Cypress Tests Passed!* 🎉%0ARepo: $GITHUB_REPOSITORY%0ARun: $GITHUB_RUN_NUMBER%0AAll tests completed successfully." \
            -d parse_mode=Markdown
