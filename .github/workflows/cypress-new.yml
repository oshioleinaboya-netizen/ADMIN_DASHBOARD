name: Run Cypress Tests

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js ≥22 (required by Cypress v15)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      - name: Debug deployed URL
        run: |
          echo "RANK_LINK is ${{ secrets.RANK_LINK }}"
          curl -I ${{ secrets.RANK_LINK }}


      # 4️⃣ Run Cypress tests against DEPLOYED app
      - name: Run Cypress Tests
        uses: cypress-io/github-action@v5
        with:
          browser: chrome
        env:
          CYPRESS_baseUrl: ${{ secrets.RANK_LINK }}
          CYPRESS_ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          CYPRESS_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      # 5️⃣ Upload Cypress artifacts on failure
      - name: Upload Cypress Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/videos
            cypress/screenshots

      # 6️⃣ Generate Allure HTML report
      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      # 7️⃣ Upload Allure HTML report
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      # 8️⃣ Send failure screenshots to Telegram
      - name: Send Failure Screenshots to Telegram
        if: failure()
        run: |
          shopt -s globstar nullglob
          for file in cypress/screenshots/**/*.png; do
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendPhoto" \
              -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -F photo=@"$file" \
              -F caption="❌ Cypress Test Failed (Screenshot attached)"
          done

      # 9️⃣ Send Telegram summary for failure
      - name: Send Telegram Notification
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ *Cypress Tests Failed!*%0ARepo: $GITHUB_REPOSITORY%0ARun: $GITHUB_RUN_NUMBER" \
            -d parse_mode=Markdown

      # 🔟 Send SUCCESS notification
      - name: Send Telegram Success Notification
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ *Cypress Tests Passed!* 🎉%0ARepo: $GITHUB_REPOSITORY%0ARun: $GITHUB_RUN_NUMBER" \
            -d parse_mode=Markdown
